[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"          # the CI matrix starts at 3.10

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "E731", "SIM300", "B905"]   # physics symbols, short lambdas, equal-length zips are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/analysis/*" = ["E501"]         # long LaTeX label strings
